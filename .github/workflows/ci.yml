name: GitHub Action
on:   
  push:
    branches:
      -main

jobs:
  action-and-builttest:
    runs-on: ubuntu-latest

    steps:
      - name: Check Repository
        uses: actions/checkout@v4

      - name: Show current user
        run: whoami

      - name: List project files
        run: ls -a

      - name: Execte files
        run: |
          chmod +x app.sh
          chmod +x test.sh

      - name: Run applications
        run: ./app.sh

      - name: Run test
        run: ./test.sh

      - name: Success
        run: echo "Completed"    